<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Exclusive ShortLink - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1rem; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
        .tg-bubble { background-color: #182533; border-radius: 12px 12px 12px 2px; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex flex-col md:flex-row overflow-x-hidden">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-[#0f172a] flex items-center justify-center p-4">
        <div class="glass-panel p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl">
            <div class="w-16 h-16 mx-auto bg-indigo-500/20 rounded-2xl flex items-center justify-center mb-6">
                <i class="fa-solid fa-lock text-3xl text-indigo-400"></i>
            </div>
            <h2 class="text-2xl font-bold mb-6 text-white">Admin Cloud Login</h2>
            
            <input type="email" id="admin-email" placeholder="Admin Email" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-xl mb-4 focus:outline-none focus:border-indigo-500 text-sm">
            <input type="password" id="admin-password" placeholder="Password" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-xl mb-6 focus:outline-none focus:border-indigo-500 text-sm">
            
            <button id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg flex items-center justify-center">
                <i class="fa-solid fa-right-to-bracket mr-2"></i> Secure Login
            </button>
        </div>
    </div>

    <!-- MAIN DASHBOARD WRAPPER -->
    <div id="admin-dashboard" class="flex flex-col md:flex-row w-full min-h-screen hidden">
        
        <!-- SIDEBAR (DESKTOP) & TOP BAR (MOBILE) -->
        <aside class="w-full md:w-64 bg-slate-900/95 border-b md:border-b-0 md:border-r border-slate-800 p-4 flex md:flex-col justify-between shrink-0 sticky top-0 z-40 backdrop-blur-md">
            <div>
                <div class="flex items-center justify-between mb-4 md:mb-8">
                    <h1 class="text-lg md:text-xl font-bold text-indigo-400 flex items-center">
                        <i class="fa-solid fa-bolt mr-2 text-indigo-500"></i>Exclusive
                    </h1>
                    <button class="md:hidden text-red-400 p-2 text-sm" onclick="logoutAdmin()"><i class="fa-solid fa-power-off"></i></button>
                </div>
                
                <!-- MOBILE HORIZONTAL SCROLL NAV & DESKTOP VERTICAL NAV -->
                <nav class="flex md:flex-col gap-2 overflow-x-auto pb-2 md:pb-0 whitespace-nowrap text-xs md:text-sm">
                    <button class="nav-btn px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-medium flex items-center shrink-0" onclick="switchTab('dashboard', this)"><i class="fa-solid fa-chart-pie mr-2"></i> Dashboard</button>
                    <button class="nav-btn px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 font-medium flex items-center shrink-0" onclick="switchTab('approvals', this)"><i class="fa-solid fa-user-clock mr-2 text-amber-400"></i> Requests</button>
                    <button class="nav-btn px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 font-medium flex items-center shrink-0" onclick="switchTab('users', this)"><i class="fa-solid fa-users mr-2"></i> Users</button>
                    <button class="nav-btn px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 font-medium flex items-center shrink-0" onclick="switchTab('withdrawals', this)"><i class="fa-solid fa-money-bill-transfer mr-2"></i> Payouts</button>
                    <button class="nav-btn px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 font-medium flex items-center shrink-0" onclick="switchTab('settings', this)"><i class="fa-solid fa-gear mr-2"></i> Settings</button>
                    <button class="nav-btn px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 font-medium flex items-center shrink-0" onclick="switchTab('broadcast', this)"><i class="fa-solid fa-bullhorn mr-2 text-amber-400"></i> Broadcast</button>
                </nav>
            </div>

            <button class="hidden md:flex items-center text-slate-400 hover:text-red-400 p-3 rounded-xl hover:bg-red-500/10 text-sm transition" onclick="logoutAdmin()">
                <i class="fa-solid fa-power-off mr-2"></i> Logout
            </button>
        </aside>

        <!-- MAIN RESPONSIVE CONTENT AREA -->
        <main id="main-content" class="flex-1 p-4 sm:p-6 md:p-8 overflow-y-auto">
            <!-- Dynamic Content Injected Here -->
        </main>
    </div>

    <!-- TEMPLATES -->
    <!-- TAB: DASHBOARD -->
    <template id="tpl-dashboard">
        <h2 class="text-xl md:text-2xl font-bold mb-4 md:mb-6">Overview Statistics</h2>
        <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 md:gap-6 mb-8">
            <div class="glass-panel p-4 md:p-6 border-l-4 border-l-indigo-500">
                <div class="text-slate-400 text-[10px] md:text-xs font-bold uppercase mb-1">Total Users</div>
                <div class="text-2xl md:text-3xl font-bold text-white" id="stat-total-users">0</div>
            </div>
            <div class="glass-panel p-4 md:p-6 border-l-4 border-l-amber-500">
                <div class="text-slate-400 text-[10px] md:text-xs font-bold uppercase mb-1">Pending Approval</div>
                <div class="text-2xl md:text-3xl font-bold text-amber-400" id="stat-pending-users">0</div>
            </div>
            <div class="glass-panel p-4 md:p-6 border-l-4 border-l-emerald-500">
                <div class="text-slate-400 text-[10px] md:text-xs font-bold uppercase mb-1">Active Today</div>
                <div class="text-2xl md:text-3xl font-bold text-white" id="stat-active-users">0</div>
            </div>
            <div class="glass-panel p-4 md:p-6 border-l-4 border-l-red-500">
                <div class="text-slate-400 text-[10px] md:text-xs font-bold uppercase mb-1">Blocked Users</div>
                <div class="text-2xl md:text-3xl font-bold text-red-400" id="stat-blocked">0</div>
            </div>
            <div class="glass-panel p-4 md:p-6 border-l-4 border-l-green-500">
                <div class="text-slate-400 text-[10px] md:text-xs font-bold uppercase mb-1">Total Paid</div>
                <div class="text-2xl md:text-3xl font-bold text-green-400" id="stat-paid">$0.00</div>
            </div>
            <div class="glass-panel p-4 md:p-6 border-l-4 border-l-amber-500">
                <div class="text-slate-400 text-[10px] md:text-xs font-bold uppercase mb-1">Pending Payouts</div>
                <div class="text-2xl md:text-3xl font-bold text-amber-400" id="stat-pending-amt">$0.00</div>
            </div>
        </div>
    </template>

    <!-- TAB: APPROVALS -->
    <template id="tpl-approvals">
        <h2 class="text-xl md:text-2xl font-bold mb-4 md:mb-6"><i class="fa-solid fa-user-clock text-amber-400 mr-2"></i> Creator Approval Requests</h2>
        <div class="glass-panel overflow-x-auto shadow-xl">
            <table class="w-full text-left text-xs md:text-sm whitespace-nowrap">
                <thead class="bg-slate-900 text-slate-400 border-b border-slate-800">
                    <tr>
                        <th class="p-3 md:p-4">User</th>
                        <th class="p-3 md:p-4">Channel / Profile</th>
                        <th class="p-3 md:p-4">Followers</th>
                        <th class="p-3 md:p-4 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="admin-approvals-list" class="divide-y divide-slate-800">
                    <tr><td colspan="4" class="p-8 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading requests...</td></tr>
                </tbody>
            </table>
        </div>
    </template>

    <!-- TAB: USERS -->
    <template id="tpl-users">
        <h2 class="text-xl md:text-2xl font-bold mb-4 md:mb-6">Registered Users</h2>
        <div class="glass-panel overflow-x-auto shadow-xl">
            <table class="w-full text-left text-xs md:text-sm whitespace-nowrap">
                <thead class="bg-slate-900 text-slate-400 border-b border-slate-800">
                    <tr>
                        <th class="p-3 md:p-4">User</th>
                        <th class="p-3 md:p-4">Status</th>
                        <th class="p-3 md:p-4">Balance</th>
                        <th class="p-3 md:p-4 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="admin-users-list" class="divide-y divide-slate-800">
                    <tr><td colspan="4" class="p-8 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </template>

    <!-- TAB: WITHDRAWALS -->
    <template id="tpl-withdrawals">
        <h2 class="text-xl md:text-2xl font-bold mb-4 md:mb-6">Payout Requests</h2>
        <div class="glass-panel overflow-x-auto shadow-xl">
            <table class="w-full text-left text-xs md:text-sm whitespace-nowrap">
                <thead class="bg-slate-900 text-slate-400 border-b border-slate-800">
                    <tr>
                        <th class="p-3 md:p-4">User</th>
                        <th class="p-3 md:p-4">Details</th>
                        <th class="p-3 md:p-4">Amount</th>
                        <th class="p-3 md:p-4 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="admin-withdraw-list" class="divide-y divide-slate-800">
                    <tr><td colspan="4" class="p-8 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </template>

    <!-- TAB: SETTINGS -->
    <template id="tpl-settings">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
            <h2 class="text-xl md:text-2xl font-bold">App & Ad Settings</h2>
            <label class="flex items-center space-x-2 cursor-pointer bg-slate-900 px-3 py-2 rounded-xl border border-slate-700">
                <span class="text-xs font-bold text-slate-300">Maintenance Mode</span>
                <input type="checkbox" id="set-maintenance" class="w-4 h-4 accent-red-500">
            </label>
        </div>

        <div class="glass-panel p-4 sm:p-6 max-w-4xl shadow-xl space-y-6">
            
            <!-- CPM & Withdraw -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Global CPM ($)</label><input type="number" step="0.01" id="set-cpm" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-indigo-500 outline-none"></div>
                <div><label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Min. Withdraw ($)</label><input type="number" step="0.5" id="set-min-with" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-indigo-500 outline-none"></div>
            </div>
            
            <!-- Monetag Settings -->
            <div class="border-t border-slate-800 pt-4">
                <h3 class="text-xs font-bold text-indigo-400 mb-3 uppercase"><i class="fa-solid fa-rectangle-ad mr-2"></i> Monetag Ads Control</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Ads to Show (Per Link)</label><input type="number" id="set-ads" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-indigo-500 outline-none"></div>
                    <div><label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Ad Timer Delay (Seconds)</label><input type="number" id="set-timer" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-indigo-500 outline-none"></div>
                </div>
            </div>

            <!-- 🔥 ADSTERRA DIRECT LINK / SMARTLINK SETTING -->
            <div class="border-t border-slate-800 pt-4 bg-amber-500/5 p-4 rounded-xl border border-amber-500/20">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-xs font-bold text-amber-400 uppercase flex items-center">
                        <i class="fa-solid fa-bolt mr-2"></i> Adsterra Direct Link (Smartlink)
                    </h3>
                    <label class="flex items-center space-x-2 cursor-pointer bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                        <span class="text-xs font-bold text-amber-300">Enable Direct Link</span>
                        <input type="checkbox" id="set-direct-enabled" class="w-4 h-4 accent-amber-500">
                    </label>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1 uppercase">Adsterra Direct Link URL</label>
                    <input type="url" id="set-direct-url" placeholder="https://www.profitablecpmrate.com/your-smartlink-url" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-amber-500 outline-none">
                    <p class="text-[10px] text-slate-400 mt-1">Har Monetag ad khatam hone ke baad yeh Direct Link open hoga (Jitna Monetag ad chalega utni bar open hoga).</p>
                </div>
            </div>

            <!-- Social Links -->
            <div class="border-t border-slate-800 pt-4">
                <h3 class="text-xs font-bold text-indigo-400 mb-3 uppercase"><i class="fa-solid fa-link mr-2"></i> Official Channels & Legal</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-3">
                    <div><label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Telegram Channel URL</label><input type="url" id="set-tg" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-indigo-500 outline-none"></div>
                    <div><label class="block text-xs font-bold text-slate-400 mb-1 uppercase">YouTube Channel URL</label><input type="url" id="set-yt" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-indigo-500 outline-none"></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Privacy Policy URL</label><input type="url" id="set-privacy" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-indigo-500 outline-none"></div>
                    <div><label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Terms of Service URL</label><input type="url" id="set-terms" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-indigo-500 outline-none"></div>
                </div>
            </div>

            <div class="border-t border-slate-800 pt-4">
                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Payment Methods (Comma separated)</label>
                <input type="text" id="set-payments" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-indigo-500 outline-none">
            </div>
            
            <button id="btn-save-settings" onclick="saveSettingsAction()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3.5 rounded-xl font-bold text-white shadow-lg transition flex items-center justify-center">
                <i class="fa-solid fa-floppy-disk mr-2"></i> Save Configuration
            </button>
        </div>
    </template>

    <!-- TAB: BROADCAST -->
    <template id="tpl-broadcast">
        <h2 class="text-xl md:text-2xl font-bold mb-4 md:mb-6">Broadcast to Telegram</h2>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="glass-panel p-4 sm:p-6">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Image URL (Optional)</label>
                    <input type="url" id="bc-image" placeholder="https://example.com/image.jpg" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-indigo-500 outline-none" oninput="updatePreview()">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Message (HTML Supported)</label>
                    <textarea id="bc-caption" rows="4" placeholder="<b>Hello User!</b>&#10;Check our update 🔥" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-indigo-500 outline-none" oninput="updatePreview()"></textarea>
                </div>
                <div class="mb-4 p-3 bg-slate-900 rounded-xl border border-slate-700">
                    <label class="flex items-center space-x-2 cursor-pointer mb-2">
                        <input type="checkbox" id="bc-btn-toggle" checked class="w-4 h-4 rounded accent-indigo-500" onchange="updatePreview()">
                        <span class="text-xs font-bold text-white">Include Mini App Button</span>
                    </label>
                    <input type="url" id="bc-mini-app-url" value="http://t.me/Exclusive_shortlink_bot/Shortlink" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white text-xs focus:border-indigo-500 outline-none">
                </div>
                <button id="btn-send-broadcast" onclick="startBroadcast()" class="w-full bg-amber-600 hover:bg-amber-500 py-3.5 rounded-xl font-bold text-white shadow-lg transition flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Send to All Users
                </button>
                <div id="bc-status" class="hidden mt-4 p-3 border border-indigo-500/30 bg-indigo-500/10 rounded-xl">
                    <div class="flex justify-between text-xs mb-1 font-bold"><span>Progress: <span id="bc-percent">0%</span></span><span id="bc-count">0 / 0</span></div>
                    <div class="w-full bg-slate-900 rounded-full h-1.5 mb-2"><div id="bc-bar" class="bg-indigo-500 h-1.5 rounded-full" style="width: 0%"></div></div>
                    <div class="flex justify-between text-[11px]"><span class="text-emerald-400">Sent: <span id="bc-sent">0</span></span><span class="text-red-400">Failed: <span id="bc-failed">0</span></span></div>
                </div>
            </div>

            <!-- Telegram Preview -->
            <div class="glass-panel p-4">
                <h3 class="text-xs font-bold text-slate-400 mb-3 uppercase">Telegram Preview</h3>
                <div class="bg-[#0e1621] p-3 rounded-xl border border-slate-700 max-w-xs mx-auto shadow-xl">
                    <div class="flex items-center space-x-2 mb-3 pb-2 border-b border-slate-800">
                        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs"><i class="fa-solid fa-robot"></i></div>
                        <div><div class="text-white font-bold text-xs">Exclusive Bot</div><div class="text-slate-400 text-[9px]">bot</div></div>
                    </div>
                    <div class="tg-bubble p-2 inline-block max-w-[95%]">
                        <img id="prev-img" src="" class="hidden w-full rounded-lg mb-2 object-cover max-h-36">
                        <div id="prev-text" class="text-white text-xs break-words leading-relaxed">Message will appear here...</div>
                    </div>
                    <div id="prev-btn" class="mt-2 w-[95%] text-center bg-[#182533] text-blue-400 font-bold py-1.5 rounded-lg text-xs border border-[#182533]">👉 Open now 👈</div>
                </div>
            </div>
        </div>
    </template>

    <script>
        const SUPABASE_URL = 'https://xdgvsavxympdynxtggke.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_gzJg8PwJeDsQMN0Ey0PuvA_oaaNRYRo';
        const VERCEL_BROADCAST_API = 'https://exclusive-shortlink.vercel.app/api/broadcast'; 
        
        let dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });
        
        let settingsId = null;

        async function checkSession() {
            const { data: { session }, error } = await dbClient.auth.getSession();
            if(!session || error) {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('admin-dashboard').classList.add('hidden');
                return;
            }
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            switchTab('dashboard', document.querySelector('.nav-btn'));
        }
        checkSession();

        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            const btn = document.getElementById('btn-login');
            
            if(!email || !password) return alert("Please enter both email and password.");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Verifying...`;

            const { data, error } = await dbClient.auth.signInWithPassword({ email: email, password: password });
            if (error) {
                alert(`Login Failed: ${error.message}`);
                btn.innerHTML = `<i class="fa-solid fa-right-to-bracket mr-2"></i> Secure Login`;
            } else { location.reload(); }
        });

        window.logoutAdmin = async function() { await dbClient.auth.signOut(); location.reload(); }

        window.switchTab = function(tabName, btnEl) {
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white');
                b.classList.add('text-slate-400');
            });
            if(btnEl) {
                btnEl.classList.remove('text-slate-400');
                btnEl.classList.add('bg-indigo-600', 'text-white');
            }

            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = document.getElementById(`tpl-${tabName}`).innerHTML;

            if(tabName === 'dashboard') loadDashboard();
            if(tabName === 'approvals') loadApprovals();
            if(tabName === 'users') loadUsers();
            if(tabName === 'withdrawals') loadWithdrawals();
            if(tabName === 'settings') loadSettings();
            if(tabName === 'broadcast') updatePreview(); 
        }

        async function loadDashboard() {
            try {
                const { count: uCount } = await dbClient.from('users').select('*', { count: 'exact', head: true });
                document.getElementById('stat-total-users').innerText = uCount || 0;

                const { count: pCount } = await dbClient.from('users').select('*', { count: 'exact', head: true }).eq('account_status', 'pending');
                document.getElementById('stat-pending-users').innerText = pCount || 0;

                const { count: bCount } = await dbClient.from('users').select('*', { count: 'exact', head: true }).eq('is_blocked', true);
                document.getElementById('stat-blocked').innerText = bCount || 0;

                const today = new Date().toISOString().split('T')[0];
                const { data: activeData } = await dbClient.from('click_logs').select('clicker_tg_id').gte('created_at', today);
                const uniqueActive = new Set(activeData?.map(d => d.clicker_tg_id)).size;
                document.getElementById('stat-active-users').innerText = uniqueActive || 0;

                const { data: wData } = await dbClient.from('withdrawals').select('amount, status');
                let paid = 0, pending = 0;
                if(wData) {
                    wData.forEach(w => {
                        if(w.status === 'approved') paid += w.amount;
                        if(w.status === 'pending') pending += w.amount;
                    });
                }
                document.getElementById('stat-paid').innerText = `$${paid.toFixed(2)}`;
                document.getElementById('stat-pending-amt').innerText = `$${pending.toFixed(2)}`;
            } catch(e) {}
        }

        async function loadApprovals() {
            const tbody = document.getElementById('admin-approvals-list');
            try {
                const { data } = await dbClient.from('users').select('*').eq('account_status', 'pending').order('apply_date', { ascending: false });
                if(!data || data.length === 0) return tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-500">No pending approval requests.</td></tr>';

                tbody.innerHTML = '';
                data.forEach(u => {
                    tbody.innerHTML += `
                        <tr class="border-b border-slate-800 hover:bg-slate-800/30">
                            <td class="p-3 md:p-4">
                                <span class="font-bold text-white">${u.first_name || 'Creator'}</span><br>
                                <span class="text-[10px] font-mono text-indigo-400">ID: ${u.telegram_id}</span>
                            </td>
                            <td class="p-3 md:p-4">
                                <a href="${u.social_link || '#'}" target="_blank" class="text-blue-400 hover:underline flex items-center text-xs">
                                    <span class="truncate max-w-[140px] md:max-w-[200px]">${u.social_link || 'No link'}</span>
                                    <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-[9px]"></i>
                                </a>
                            </td>
                            <td class="p-3 md:p-4 font-bold text-amber-400">${u.followers_count || '0'}</td>
                            <td class="p-3 md:p-4 text-center">
                                <button onclick="setApproval('${u.id}', 'approved')" class="bg-emerald-600 hover:bg-emerald-500 px-2.5 py-1 rounded-lg text-white font-bold text-xs mr-1 transition"><i class="fa-solid fa-check"></i></button>
                                <button onclick="setApproval('${u.id}', 'rejected')" class="bg-red-600 hover:bg-red-500 px-2.5 py-1 rounded-lg text-white font-bold text-xs transition"><i class="fa-solid fa-xmark"></i></button>
                            </td>
                        </tr>`;
                });
            } catch(e) {}
        }

        window.setApproval = async function(userId, status) {
            if(!confirm(`Confirm ${status.toUpperCase()} this user?`)) return;
            try {
                await dbClient.from('users').update({ account_status: status }).eq('id', userId);
                loadApprovals();
            } catch(e) { alert("Error: " + e.message); }
        }

        async function loadUsers() {
            const tbody = document.getElementById('admin-users-list');
            try {
                const { data } = await dbClient.from('users').select('*').order('created_at', { ascending: false });
                if(!data || data.length === 0) return tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-500">No users found.</td></tr>';

                tbody.innerHTML = '';
                data.forEach(u => {
                    let statusBadge = '<span class="text-emerald-400 font-bold text-xs">Approved</span>';
                    if (u.account_status === 'pending') statusBadge = '<span class="text-amber-400 font-bold text-xs">Pending</span>';
                    if (u.account_status === 'rejected') statusBadge = '<span class="text-red-400 font-bold text-xs">Rejected</span>';
                    if (u.account_status === 'unregistered') statusBadge = '<span class="text-slate-400 text-xs">Unregistered</span>';
                    if (u.is_blocked) statusBadge = '<span class="text-red-600 font-bold text-xs">Blocked</span>';

                    const blockAction = u.is_blocked 
                        ? `<button onclick="toggleBlock('${u.id}', false)" class="text-emerald-400 p-1" title="Unblock"><i class="fa-solid fa-unlock"></i></button>`
                        : `<button onclick="toggleBlock('${u.id}', true)" class="text-amber-400 p-1" title="Block"><i class="fa-solid fa-lock"></i></button>`;

                    tbody.innerHTML += `
                        <tr class="border-b border-slate-800 hover:bg-slate-800/30">
                            <td class="p-3 md:p-4">
                                <span class="font-medium text-white">${u.first_name || 'N/A'}</span><br>
                                <span class="text-[10px] font-mono text-indigo-400">${u.telegram_id}</span>
                            </td>
                            <td class="p-3 md:p-4">${statusBadge}</td>
                            <td class="p-3 md:p-4 font-bold text-emerald-400">$${parseFloat(u.balance || 0).toFixed(2)}</td>
                            <td class="p-3 md:p-4 text-right">
                                ${blockAction}
                                <button onclick="deleteUser('${u.id}')" class="text-red-400 p-1 ml-2" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                            </td>
                        </tr>`;
                });
            } catch (e) {}
        }

        window.toggleBlock = async function(userId, blockStatus) {
            if(!confirm(`Confirm ${blockStatus ? 'Block' : 'Unblock'}?`)) return;
            await dbClient.from('users').update({ is_blocked: blockStatus }).eq('id', userId);
            loadUsers();
        }

        window.deleteUser = async function(userId) {
            if(!confirm(`Permanently DELETE this user?`)) return;
            try {
                await dbClient.from('users').delete().eq('id', userId);
                loadUsers();
            } catch(e) { alert("Deletion failed: " + e.message); }
        }

        async function loadWithdrawals() {
            const tbody = document.getElementById('admin-withdraw-list');
            try {
                const { data } = await dbClient.from('withdrawals').select('*').order('created_at', { ascending: false });
                if(!data || data.length === 0) return tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-500">No requests found.</td></tr>';

                tbody.innerHTML = '';
                data.forEach(w => {
                    let actionHtml = '';
                    if(w.status === 'pending') {
                        actionHtml = `
                            <button onclick="processWithdrawal('${w.id}', '${w.user_id}', ${w.amount}, 'approved')" class="bg-emerald-600 px-2 py-1 rounded text-white text-xs mr-1">Approve</button>
                            <button onclick="processWithdrawal('${w.id}', '${w.user_id}', ${w.amount}, 'rejected')" class="bg-red-600 px-2 py-1 rounded text-white text-xs">Reject</button>
                        `;
                    } else {
                        const color = w.status === 'approved' ? 'text-emerald-400' : 'text-red-400';
                        actionHtml = `<span class="${color} font-bold text-xs uppercase">${w.status}</span>`;
                    }

                    tbody.innerHTML += `
                        <tr class="border-b border-slate-800 hover:bg-slate-800/30">
                            <td class="p-3 md:p-4 font-mono text-indigo-300 text-xs">${w.username || 'User'}</td>
                            <td class="p-3 md:p-4 text-xs"><b>${w.method}</b><br><span class="text-slate-400">${w.details}</span></td>
                            <td class="p-3 md:p-4 font-bold text-emerald-400">$${parseFloat(w.amount).toFixed(2)}</td>
                            <td class="p-3 md:p-4 text-center">${actionHtml}</td>
                        </tr>`;
                });
            } catch(e) {}
        }

        window.processWithdrawal = async function(wId, userId, amount, newStatus) {
            if(!confirm(`Mark as ${newStatus.toUpperCase()}?`)) return;
            try {
                await dbClient.from('withdrawals').update({ status: newStatus }).eq('id', wId);
                if(newStatus === 'rejected') {
                    const { data: u } = await dbClient.from('users').select('balance').eq('id', userId).single();
                    if(u) await dbClient.from('users').update({ balance: parseFloat(u.balance) + parseFloat(amount) }).eq('id', userId);
                }
                loadWithdrawals();
            } catch(e) { alert("Error updating status."); }
        }

        async function loadSettings() {
            try {
                const { data } = await dbClient.from('settings').select('*').limit(1).single();
                if(data) {
                    settingsId = data.id;
                    document.getElementById('set-cpm').value = data.cpm || 0;
                    document.getElementById('set-ads').value = data.ads_per_link || 1;
                    document.getElementById('set-timer').value = data.ad_timer || 5;
                    document.getElementById('set-payments').value = data.payment_methods || '';
                    document.getElementById('set-min-with').value = data.min_withdraw || 5;
                    document.getElementById('set-tg').value = data.tg_channel_url || '';
                    document.getElementById('set-yt').value = data.yt_channel_url || '';
                    document.getElementById('set-privacy').value = data.privacy_url || '';
                    document.getElementById('set-terms').value = data.terms_url || '';
                    document.getElementById('set-maintenance').checked = data.maintenance_mode || false;
                    
                    // Adsterra Direct Link Load
                    document.getElementById('set-direct-url').value = data.direct_link_url || '';
                    document.getElementById('set-direct-enabled').checked = data.direct_link_enabled || false;
                }
            } catch(e) {}
        }

        window.saveSettingsAction = async function() {
            const btn = document.getElementById('btn-save-settings');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...`;
            
            const updates = {
                cpm: parseFloat(document.getElementById('set-cpm').value) || 0,
                ads_per_link: parseInt(document.getElementById('set-ads').value) || 1,
                ad_timer: parseInt(document.getElementById('set-timer').value) || 5,
                payment_methods: document.getElementById('set-payments').value,
                min_withdraw: parseFloat(document.getElementById('set-min-with').value) || 5,
                tg_channel_url: document.getElementById('set-tg').value,
                yt_channel_url: document.getElementById('set-yt').value,
                privacy_url: document.getElementById('set-privacy').value,
                terms_url: document.getElementById('set-terms').value,
                maintenance_mode: document.getElementById('set-maintenance').checked,
                
                // Adsterra Direct Link Save
                direct_link_url: document.getElementById('set-direct-url').value.trim(),
                direct_link_enabled: document.getElementById('set-direct-enabled').checked
            };
            
            try {
                if(settingsId) {
                    await dbClient.from('settings').update(updates).eq('id', settingsId);
                } else {
                    const { data } = await dbClient.from('settings').insert([updates]).select();
                    if(data) settingsId = data[0].id;
                }
                alert('Settings Saved Successfully!');
            } catch(e) { alert(`Error: ${e.message}`); }
            btn.innerHTML = `<i class="fa-solid fa-floppy-disk mr-2"></i> Save Configuration`;
        }

        window.updatePreview = function() {
            const img = document.getElementById('bc-image')?.value || '';
            const text = document.getElementById('bc-caption')?.value || 'Message preview...';
            const showBtn = document.getElementById('bc-btn-toggle')?.checked;

            const pImg = document.getElementById('prev-img');
            if(img) { pImg.src = img; pImg.classList.remove('hidden'); } else { pImg.classList.add('hidden'); }
            document.getElementById('prev-text').innerHTML = text.replace(/\n/g, '<br>');
            if(showBtn) document.getElementById('prev-btn').classList.remove('hidden'); else document.getElementById('prev-btn').classList.add('hidden');
        }

        window.startBroadcast = async function() {
            const btn = document.getElementById('btn-send-broadcast');
            const imgUrl = document.getElementById('bc-image').value.trim();
            const caption = document.getElementById('bc-caption').value;
            const useBtn = document.getElementById('bc-btn-toggle').checked;
            const miniAppUrl = document.getElementById('bc-mini-app-url').value.trim();

            if(!caption && !imgUrl) return alert("Please add an image or a message.");
            if(!confirm("Send broadcast to ALL users?")) return;

            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Sending...';
            document.getElementById('bc-status').classList.remove('hidden');

            try {
                const { data: users } = await dbClient.from('users').select('telegram_id').not('telegram_id', 'is', null);
                if(!users || users.length === 0) throw new Error("No users found.");
                
                const chatIds = users.map(u => u.telegram_id);
                const total = chatIds.length;
                let sent = 0; let failed = 0;

                const chunkSize = 25;
                for (let i = 0; i < total; i += chunkSize) {
                    const chunk = chatIds.slice(i, i + chunkSize);
                    const response = await fetch(VERCEL_BROADCAST_API, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_ids: chunk, image_url: imgUrl, caption: caption, use_button: useBtn, mini_app_url: miniAppUrl })
                    });
                    if(response.ok) {
                        const result = await response.json();
                        sent += result.sent || 0; failed += result.failed || 0;
                    } else { failed += chunk.length; }

                    let processed = Math.min(i + chunkSize, total);
                    let percent = Math.round((processed / total) * 100);
                    document.getElementById('bc-percent').innerText = `${percent}%`;
                    document.getElementById('bc-count').innerText = `${processed} / ${total}`;
                    document.getElementById('bc-bar').style.width = `${percent}%`;
                    document.getElementById('bc-sent').innerText = sent;
                    document.getElementById('bc-failed').innerText = failed;
                }
                alert(`Broadcast Completed!\nSent: ${sent}\nFailed: ${failed}`);
            } catch(e) { alert("Error: " + e.message); }
            btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Send to All Users';
        }
    </script>
</body>
